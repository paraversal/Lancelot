name: CI

# Fast checks on every push and pull request. Full app builds run in build.yml.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p lancelot-core -p lancelot-service -p lancelot-bridge --all-targets -- -D warnings
      - run: cargo test -p lancelot-core -p lancelot-service -p lancelot-bridge
      # cargo test regenerates the TypeScript types and the UI's example event;
      # the committed ones must match.
      - name: Generated UI files are up to date
        run: |
          git diff --exit-code -- app/src/lib/api/generated app/src/lib/api/fixtures/*.json
          test -z "$(git status --porcelain -- app/src/lib/api/generated app/src/lib/api/fixtures)"

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in app/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
