[workspace]
resolver = "3"
members = ["crates/lancelot-core", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/paraversal/Lancelot"

[workspace.dependencies]
lancelot-core = { path = "crates/lancelot-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3.47", features = ["serde-human-readable", "macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_arithmetic = "deny"
